<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Visual Novel Interface</title>
    <style> 
        /* --- General Reset & Background --- */
        body { 
            margin: 0; 
            padding: 0; 
            background: #121214; 
            color: #f0f0f5; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* --- Global Custom Scrollbars for Text and Logs --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

        /* --- Clean Left Sidebar Panel (Safe solid transparency layer) --- */
        #control-panel { 
            width: 340px; 
            padding: 25px 20px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            background: #1e1e24; /* Restored solid backup value to guarantee visibility */
            border-right: 2px solid #2d2d35; 
            z-index: 90; 
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
        }
        
        #control-panel.is-hidden {
            transform: translateX(-340px);
            margin-right: -340px;
        }

        /* --- Dropdowns FIXED Text Visibility --- */
        label { font-size: 11px; color: #a0a0b0; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; display: block; }
        select { 
            width: 100%; 
            padding: 12px; 
            background: #2d2d3a !important; /* Force deep backing element */
            color: #ffffff !important;    /* FORCE text visibility color value */
            border: 1px solid #444455; 
            border-radius: 6px; 
            font-size: 14px; 
            cursor: pointer;
            outline: none;
            margin-bottom: 15px;
        }

        /* --- Input Bar Styling --- */
        #text-input-container { display: flex; gap: 8px; margin-top: auto; }
        #text-input { 
            flex: 1; 
            padding: 12px; 
            background: #2d2d3a; 
            color: white; 
            border: 1px solid #444455; 
            border-radius: 6px; 
            font-size: 14px; 
            outline: none;
        }
        #text-input:focus { border-color: #00ffcc; }

        /* --- Interface Theme Button Styling --- */
        button { 
            font-family: inherit;
            border: none; 
            padding: 12px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            transition: all 0.2s ease;
        }
        
        #send-btn, #ui-toggle-btn { background: #28a745; color: white; }
        #send-btn:hover, #ui-toggle-btn:hover { background: #218838; }
        
        #ui-close-btn, #hide-textbox-btn, #close-log-btn { background: #dc3545; color: white; }
        #ui-close-btn:hover, #hide-textbox-btn:hover, #close-log-btn:hover { background: #bd2130; }
        
        #open-log-btn { background: #4b6cb7; color: white; width: 100%; margin-bottom: 20px; }
        #open-log-btn:hover { background: #1ebd74; }

        /* --- Main Stage Panel Window (FIXED Background scale) --- */
        #canvas-container { 
            flex: 1; 
            position: relative; 
            height: 100%; 
            background-color: #1a1a1a; 
            background-size: cover;      /* Forces your room image to stretch fully */
            background-position: center;  /* Centers your room image */
            display: flex; 
            align-items: flex-end; 
            justify-content: center; 
            overflow: hidden;
        }

        #character-sprite {
            max-width: 90%;
            max-height: 95%;
            object-fit: contain;
            transition: transform 0.25s ease-out, filter 0.25s ease-out;
            transform-origin: bottom center;
            filter: brightness(0.95); /* Lifted dimming vector value */
        }

        #character-sprite.is-speaking {
            filter: brightness(1.1); 
            transform: scale(1.03);     
            animation: gentle-bounce 0.8s infinite alternate ease-in-out;
        }

        @keyframes gentle-bounce {
            0% { transform: scale(1.03) translateY(0px); }
            100% { transform: scale(1.03) translateY(-6px); }
        }

        /* --- Deep Translucent Visual Novel Stage Dialogue Box --- */
        #vn-textbox {
            position: absolute;
            
            /* FIXED: Force the box to lock to a lower baseline index position */
            bottom: 15px; 
            left: 54%; /* Offset slightly right to center with the open menu panel */
            transform: translateX(-50%) !important;
            
            /* FIXED: Set static dimensions so it behaves like a standard game frame */
            width: 80%;              
            max-width: 900px;
            height: 160px; /* Lock standard height size parameter */
            
            background: rgba(5, 5, 8, 0.65); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow: visible; 
        }

        /* Highly Styled Text Layout with native scrolling capabilities */
        #dialogue-display {
            width: 100%;
            height: 100%;
            color: #ffffff; 
            padding: 22px 28px; 
            box-sizing: border-box; 
            font-size: 20px;    
            line-height: 1.6; 
            font-family: 'Segoe UI', Helvetica, sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.95); 
            
            /* FIXED: Allows the box to handle infinite text by scrolling cleanly */
            overflow-y: auto; 
        }


        /* --- Sleek Top-Right Corner Close Button --- */
        #hide-textbox-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 26px;
            height: 26px;
            padding: 0;
            background: #1e1e24 !important;
            color: #ff6b7b !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 50% !important; /* Circular look */
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.15s ease-out;
            z-index: 25;
        }
        #hide-textbox-btn:hover {
            background: #dc3545 !important;
            color: #ffffff !important;
            transform: scale(1.1);
        }

        /* --- Inline Height Range Track Overlay --- */
        #vn-height-control-wrap {
            position: absolute;
            bottom: -25px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.3; /* Stays heavily faded out so it doesn't break game immersion */
            transition: opacity 0.2s ease;
            z-index: 22;
        }
        #vn-height-control-wrap:hover {
            opacity: 1.0; /* Lights up clean only when mouse pointer hovers nearby */
        }

        input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; width: 80px; cursor: pointer; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 10px; width: 10px; border-radius: 50%; background: #ffffff; margin-top: -3px; }


        /* --- Full Screen Backlog History Archive Layout --- */
        #history-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(12px);
            z-index: 150; display: none; align-items: center; justify-content: center;
        }
        #history-content-box {
            width: 85%; max-width: 720px; height: 75vh;
            background: #1e1e24; border: 1px solid #444; border-radius: 12px;
            padding: 30px; display: flex; flex-direction: column;
        }
        #history-log-text-area { flex: 1; overflow-y: auto; font-size: 16px; line-height: 1.7; color: #ddd; white-space: pre-wrap; }
        #status { font-size: 13px; color: #00ffcc; font-weight: bold; }

    </style>
</head>
<body>

    <!-- 1. The Toggle Button (Stays fixed to bring back the UI panel) -->
    <button id="ui-toggle-btn" style="position: absolute; top: 15px; left: 15px; z-index: 100; padding: 10px 15px; font-size: 14px;">☰ Open Options</button>

    <!-- 2. Polished Control Panel Sidebar -->
    <div id="control-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">AI VN Panel</h2>
            <button id="ui-close-btn" style="background: #dc3545; padding: 5px 10px; margin: 0; font-size: 14px;">✕ Close</button>
        </div>
        
        <div id="status">Status: Ready</div>

        <!-- Background Selection -->
        <div style="margin-bottom: 15px; margin-top: 15px;">
            <label for="bg-select" style="font-size: 13px; color: #aaa; display: block; margin-bottom: 5px;">Change Location Scene:</label>
            <select id="bg-select" style="width: 100%; padding: 10px; background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 4px; font-size: 14px; cursor: pointer;">
                <option value="bedroom1.png">Bedroom</option>
                <option value="living_room1.png">Living Room</option>
                <option value="kitchen1.png">kitchen</option>
                <option value="outside1.png">outside</option>
            </select>
        </div>

        <!-- Outfit Selection -->
        <div style="margin-bottom: 20px;">
            <label for="outfit-select" style="font-size: 13px; color: #aaa; display: block; margin-bottom: 5px;">Change Outfit:</label>
            <select id="outfit-select" style="width: 100%; padding: 10px; background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 4px; font-size: 14px; cursor: pointer;">
                <option value="sweater_outfit/">Cozy Sweater</option>
                <option value="maid_outfit/">Maid Uniform</option>
                <option value="bikini_outfit/">Bikini Outfit</option>
            </select>
        </div>

        <!-- NEW VISUAL NOVEL HISTORY TOGGLE TOOL -->
        <button id="open-log-btn" style="background: #007bff; width: 100%; margin-bottom: 20px;">📖 View History Log</button>
        
        <!-- Text Input Layer -->
        <div id="text-input-container">
            <input type="text" id="text-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- 3. Character Display Stage -->
    <div id="canvas-container">
        <img id="character-sprite" src="" alt="AI Character">

        <div id="vn-textbox">
            <!-- Sleek Minimalist Close Icon -->
            <button id="hide-textbox-btn" title="Hide Dialogue">✕</button>
            
            <!-- Dynamic Height Controller slider (Tucked away subtly inside the frame layout) -->
            <div id="vn-height-control-wrap">
                <span style="font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px;">Size:</span>
                <input type="range" id="box-height-slider" min="80" max="300" value="140">
            </div>
            
            <div id="dialogue-display">
                Conversation history will appear here...
            </div>
        </div>

        
        <button id="show-textbox-btn" style="display: none; position: absolute; bottom: 20px; right: 20px; z-index: 30; padding: 8px 12px; font-size: 13px;">Show Dialogue</button>

        <!-- NEW VISUAL NOVEL HISTORY LOG BACKLOG OVERLAY LAYER -->
        <div id="history-overlay">
            <div id="history-content-box">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 15px;">
                    <h3 style="margin: 0; color: #00ffcc;">Dialogue Backlog History</h3>
                    <button id="close-log-btn" style="background: #dc3545; margin: 0; padding: 5px 12px; font-size: 13px;">✕ Close Log</button>
                </div>
                <div id="history-log-text-area">
                    <!-- Complete conversational transcripts accumulate here -->
                </div>
            </div>
        </div>
    </div>


    <script type="module">
        const statusDiv = document.getElementById('status');
        const chatHistory = document.getElementById('chat-history');
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');
        const spriteEl = document.getElementById('character-sprite');

        // --- Configuration: Asset File Locations ---
        // To change outfits, you only ever need to modify this prefix path!
        let currentOutfitFolder = '/static/images/sweater_outfit/';
        
        const assets = {
            idle1: 'idle1.png',
            idle2: 'idle2.png',
            talking: 'talking.png'
        };

        let isSpeaking = false;
        let idleInterval = null;

        // Build path resolution helpers
        function getAssetPath(key) {
            return `${currentOutfitFolder}${assets[key]}`;
        }

        // --- Core Render Logic ---
        function initCharacter() {
            spriteEl.src = getAssetPath('idle1');
            const stage = document.getElementById('canvas-container');
            stage.style.backgroundImage = "url('/static/images/backgrounds/bedroom1.png')";
            statusDiv.innerText = "Status: Ready";
            startIdleShuffleLoop();
        }

        // Shifts between random idle poses safely when she isn't talking
        function startIdleShuffleLoop() {
            if (idleInterval) clearInterval(idleInterval);
            
            idleInterval = setInterval(() => {
                if (!isSpeaking) {
                    // Randomly switches between idle1 and idle2 frame entries
                    const chosenFrame = Math.random() > 0.5 ? 'idle1' : 'idle2';
                    spriteEl.src = getAssetPath(chosenFrame);
                }
            }, 6000); // Transitions frames every 6 seconds
        }

        // State controller to hook up audio and network behaviors
        function setSpeakingState(speaking) {
            isSpeaking = speaking;
            if (speaking) {
                spriteEl.src = getAssetPath('talking');
                spriteEl.classList.add('is-speaking');
            } else {
                spriteEl.src = getAssetPath('idle1');
                spriteEl.classList.remove('is-speaking');
                statusDiv.innerText = "Status: Ready";
            }
        }

        // --- Core Internal Memory Backlog Array ---
        const dialogueBacklogHistory = [];

        function sendTextMessage() {
            const text = textInput.value.trim();
            if (!text) return;
            
            statusDiv.innerText = "Status: Thinking...";
            
            // Clear input box immediately on send
            textInput.value = ""; 

            const formData = new FormData();
            formData.append('text', text);

            fetch('/api/chat-text', { method: 'POST', cache: 'no-store', body: formData })
            .then(async (response) => {
                const anim = response.headers.get('x-detected-animation');
                const aiText = response.headers.get('x-ai-text') || '...';
                
                if (anim && anim !== 'neutral' && anim !== 'idle') {
                    console.log("Animation/Outfit cue triggered:", anim);
                }
                
                // 1. Update the dialogue window with ONLY the newest response
                const displayDiv = document.getElementById('dialogue-display');
                displayDiv.innerText = aiText;
                
                // 2. Automatically forces the text to scroll down to the bottom
                setTimeout(() => {
                    displayDiv.scrollTop = displayDiv.scrollHeight;
                }, 50);

                // 3. Secretly log the transcript block into our background text array collection
                dialogueBacklogHistory.push(`You: ${text}`);
                dialogueBacklogHistory.push(`AI: ${aiText}\n`);
                
                // Keep the hidden modal log viewport text content updated
                document.getElementById('history-log-text-area').innerText = dialogueBacklogHistory.join('\n');

                return response.blob();
            })

            .then(blob => {
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);
                
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaElementSource(audio);
                const analyzer = audioCtx.createAnalyser();
                analyzer.fftSize = 32;
                source.connect(analyzer);
                analyzer.connect(audioCtx.destination);
                
                const dataArray = new Uint8Array(analyzer.frequencyBinCount);
                
                function trackMouth() {
                    if (!audio.paused) {
                        analyzer.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                        let average = sum / dataArray.length;

                        if (average > 2) { 
                            if (!isSpeaking) setSpeakingState(true);
                        } else {
                            if (isSpeaking) setSpeakingState(false);
                        }
                        requestAnimationFrame(trackMouth);
                    } else {
                        setSpeakingState(false);
                    }
                }

                statusDiv.innerText = "Status: Speaking...";
                setSpeakingState(true);
                audio.play();
                trackMouth();
            })
            .catch(err => { 
                console.error(err); 
                statusDiv.innerText = "Status: Server Connection Error"; 
                setSpeakingState(false);
            });
        }

        // --- Event Listeners Initialization ---
        sendBtn.addEventListener('click', sendTextMessage);
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        // --- 1. FIXED: Background Scene Switcher (No crash via absolute element mapping) ---
        const bgSelect = document.getElementById('bg-select');
        bgSelect.addEventListener('change', (event) => {
            const stage = document.getElementById('canvas-container');
            stage.style.backgroundImage = `url('/static/images/backgrounds/${event.target.value}')`;
        });

        // --- 2. Outfit Location Folder Switcher ---
        const outfitSelect = document.getElementById('outfit-select');
        outfitSelect.addEventListener('change', (event) => {
            currentOutfitFolder = `/static/images/${event.target.value}`;
            spriteEl.src = isSpeaking ? getAssetPath('talking') : getAssetPath('idle1');
        });

        // --- 3. Panel Visibility Toggle (Open/Close Feature) ---
        const controlPanel = document.getElementById('control-panel');
        const closeBtn = document.getElementById('ui-close-btn');
        const toggleBtn = document.getElementById('ui-toggle-btn');

        closeBtn.addEventListener('click', () => { controlPanel.classList.add('is-hidden'); });
        toggleBtn.addEventListener('click', () => { controlPanel.classList.remove('is-hidden'); });

        // --- 4. Clean Layout Display Controls (No Dragging) ---
        const vnTextbox = document.getElementById('vn-textbox');
        const hideTextBtn = document.getElementById('hide-textbox-btn');
        const showTextBtn = document.getElementById('show-textbox-btn');
        const heightSlider = document.getElementById('box-height-slider');
        const dialogueDisplayDiv = document.getElementById('dialogue-display');

        hideTextBtn.addEventListener('click', () => {
            vnTextbox.style.display = 'none';
            showTextBtn.style.display = 'block';
        });

        showTextBtn.addEventListener('click', () => {
            vnTextbox.style.display = 'flex';
            showTextBtn.style.display = 'none';
        });

        //heightSlider.addEventListener('input', (e) => {
        //    dialogueDisplayDiv.style.height = `${e.target.value}px`;
        //});

        // --- 5. NEW: Visual Novel History Modal Backlog Controllers ---
        const historyOverlay = document.getElementById('history-overlay');
        const openLogBtn = document.getElementById('open-log-btn');
        const closeLogBtn = document.getElementById('close-log-btn');
        const historyLogTextArea = document.getElementById('history-log-text-area');

        openLogBtn.addEventListener('click', () => {
            historyOverlay.style.display = 'flex';
            // Smoothly auto scroll view box tracking to latest transcript line additions
            historyLogTextArea.scrollTop = historyLogTextArea.scrollHeight;
        });

        closeLogBtn.addEventListener('click', () => {
            historyOverlay.style.display = 'none';
        });

        // Initialize layout engine on window startup
        initCharacter();


    </script>
</body>
</html>
