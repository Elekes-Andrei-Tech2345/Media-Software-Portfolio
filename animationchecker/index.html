<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick VRMA & VRM Animation Tester</title>
    <!-- Three.js and GLTFLoader loaded securely over CDN -->
    
    <script type="importmap">
        {
            "imports": {
                "three": "/js/three.module.js",
                "three/addons/loaders/GLTFLoader.js": "/js/GLTFLoader.js",
                "three/addons/utils/BufferGeometryUtils.js": "/js/utils/BufferGeometryUtils.js",
                "@pixiv/three-vrm": "/js/three-vrm.module.js",
                "@pixiv/three-vrm-animation": "/js/three-vrm-animation.module.js"
            }
        }
    </script>

    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0; padding: 15px; background-color: #121212; color: #e0e0e0;
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; box-sizing: border-box; overflow: hidden; /* This hides the scrollbar */
        }
        h1 { margin: 0 0 2px 0; color: #fff; font-size: 20px; }
        p { margin: 0 0 10px 0; color: #aaa; text-align: center; font-size: 13px; }
        #drop-zone-container { display: flex; gap: 15px; width: 100%; max-width: 800px; margin-bottom: 10px; }
        
        /* Shrunk the canvas height slightly to prevent stretching off-screen */
        #canvas-container {
            width: 100%; max-width: 800px; height: calc(100vh - 220px); border-radius: 8px;
            overflow: hidden; background-color: #000; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #status-msg {
            position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.8);
            padding: 8px 15px; border-radius: 4px; font-size: 13px; pointer-events: none; max-width: 80%;
        }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
        button {
            background-color: #007bff; color: white; border: none; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <h1>VRMA Animation Tester</h1>
    <p>Upload a character (.vrm) and an animation (.vrma) to instantly preview them together.</p>

    <div id="drop-zone-container">
        <div id="drop-vrm" class="drop-zone">
            <p>1. Load Character File</p>
            <span id="vrm-label">Click or drop a .vrm file here</span>
            <input type="file" id="input-vrm" accept=".vrm">
        </div>
        <div id="drop-vrma" class="drop-zone">
            <p>2. Load Animation File</p>
            <span id="vrma-label">Click or drop a .vrma file here</span>
            <input type="file" id="input-vrma" accept=".vrma">
        </div>
    </div>

    <div id="canvas-container">
        <div id="status-msg">Ready. Please upload a character and animation file.</div>
    </div>

    <div class="btn-group">
        <button id="btn-play" disabled>Play / Pause</button>
    </div>

    <script type="module">

        import * as THREE from 'three';
        import { AnimationMixer } from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';
        import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

        const dropVrm = document.getElementById('drop-vrm');
        const dropVrma = document.getElementById('drop-vrma');
        const inputVrm = document.getElementById('input-vrm');
        const inputVrma = document.getElementById('input-vrma');
        const vrmLabel = document.getElementById('vrm-label');
        const vrmaLabel = document.getElementById('vrma-label');
        const statusMsg = document.getElementById('status-msg');
        const btnPlay = document.getElementById('btn-play');
        const container = document.getElementById('canvas-container');

        let scene, camera, renderer, clock, mixer, currentModel, currentAnimationAction;
        let vrmDataBuffer = null, vrmaDataBuffer = null;

        // --- ADD THESE CAMERA tracking variables ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRadius = 2.5;
        let cameraTheta = 0; // Horizontal angle tracking
        let cameraPhi = Math.PI / 2; // Vertical angle tracking
        const cameraTarget = new THREE.Vector3(0.0, 1.3, 0.0);


        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 1.3, 2.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(2, 4, 5);
            scene.add(dirLight);

            function updateCameraPosition() {
                camera.position.x = cameraTarget.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
                camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraPhi);
                camera.position.z = cameraTarget.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
                camera.lookAt(cameraTarget);
            }

            // --- MOUSE ROTATION CODE START ---
            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                cameraTheta -= deltaX * 0.01;
                cameraPhi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraPhi - deltaY * 0.01));

                updateCameraPosition();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
            // --- MOUSE ROTATION CODE END ---

            // --- MOUSE WHEEL ZOOM CODE START ---
            container.addEventListener('wheel', (e) => {
                e.preventDefault(); // Stop the actual web page from trying to scroll
                
                // Adjust zoom speed based on scroll direction
                cameraRadius += e.deltaY * 0.002;
                
                // Clamp zoom limits so you don't zoom through her head or off into space
                cameraRadius = Math.max(0.5, Math.min(10.0, cameraRadius));
                
                updateCameraPosition();
            }, { passive: false });
            // --- MOUSE WHEEL ZOOM CODE END ---


            scene.add(new THREE.GridHelper(10, 10, 0x444444, 0x222222));
            clock = new THREE.Clock();

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            if (currentModel) {
                if (currentModel.update) currentModel.update(delta);
                if (currentModel.userData && currentModel.userData.vrm && currentModel.userData.vrm.update) {
                    currentModel.userData.vrm.update(delta);
                }
            }

            renderer.render(scene, camera);
        }

        function setupEvents(zone, input, label, type) {
            zone.addEventListener('click', () => input.click());
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('hover'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('hover'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault(); zone.classList.remove('hover');
                if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0], zone, label, type);
            });
            input.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFile(e.target.files[0], zone, label, type);
            });
        }

        function handleFile(file, zone, label, type) {
            label.textContent = file.name;
            zone.classList.add('loaded');
            const reader = new FileReader();
            reader.onload = function (e) {
                if (type === 'vrm') {
                    vrmDataBuffer = e.target.result;
                    statusMsg.textContent = "Character data read. Drop your .vrma file next.";
                    loadVisualizer();
                } else {
                    vrmaDataBuffer = e.target.result;
                    statusMsg.textContent = "Animation data read. Processing tracks...";
                    loadVisualizer();
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function loadVisualizer() {
            if (!vrmDataBuffer) return;
            statusMsg.textContent = "Parsing local 3D architecture files...";
            
            if (currentModel) {
                scene.remove(currentModel.scene);
                currentModel = null; mixer = null; currentAnimationAction = null;
                btnPlay.disabled = true;
            }

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.parse(vrmDataBuffer, '', function (gltf) {
                const vrm = gltf.userData.vrm;
                currentModel = vrm;
                scene.add(vrm.scene);
                
                // Spin her 180 degrees so she faces you directly
                vrm.scene.rotation.y = Math.PI;
                statusMsg.textContent = "Character model compiled into workspace viewport.";

                if (vrmaDataBuffer) {
                    statusMsg.textContent = "Binding specific tracking rigs to your character joints...";
                    
                    const vrmaLoader = new GLTFLoader();
                    vrmaLoader.register((parser) => new VRMAnimationLoaderPlugin(parser));

                    vrmaLoader.parse(vrmaDataBuffer, '', function (vrmaGltf) {
                        // Fallback check to support both singular and plural API array structures safely
                        const vrmAnimation = vrmaGltf.userData.vrmAnimation || 
                                             (vrmaGltf.userData.vrmAnimations && vrmaGltf.userData.vrmAnimations[0]);

                        if (vrmAnimation) {
                            mixer = new AnimationMixer(gltf.scene);

                            // Force the clip loader to ignore eye tracking and look exclusively at body bones
                            const clip = createVRMAnimationClip(vrmAnimation, gltf.userData.vrm, { ignoreLookAt: true, ignoreExpression: true });

                            currentAnimationAction = mixer.clipAction(clip);
                            currentAnimationAction.play();
                            btnPlay.disabled = false;
                            statusMsg.textContent = "Success: Local tracking data applied to your avatar bones.";
                        } else {
                            console.log("Inspecting VRMA file keys:", vrmaGltf.userData);
                            statusMsg.textContent = "Error: Found structure details, but couldn't verify VRMA joints.";
                        }
                    }, function (err) {
                        statusMsg.textContent = "Structure Error: Local target cannot decode the animation format.";
                    });
                }
            }, function (error) {
                statusMsg.textContent = "Mesh Error: Local layout could not parse the character's bone rig hierarchy.";
            });
        }

        btnPlay.addEventListener('click', () => {
            if (currentAnimationAction) {
                currentAnimationAction.paused = !currentAnimationAction.paused;
                statusMsg.textContent = currentAnimationAction.paused ? "Playback Stopped." : "Looping keyframes.";
            }
        });

        initThree();
        setupEvents(dropVrm, inputVrm, vrmLabel, 'vrm');
        setupEvents(dropVrma, inputVrma, vrmaLabel, 'vrma');
    </script>
</body>
</html>
